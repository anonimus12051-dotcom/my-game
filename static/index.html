<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Моя игра</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { margin:0; padding:16px; font-family:sans-serif;
         background:#1b1b24; color:#eee; }
  .card { background:#272735; border-radius:12px; padding:14px; margin-bottom:12px; }
  .head { display:flex; align-items:center; gap:12px; }
  #avatar { width:64px; height:64px; border-radius:50%; background:#444; object-fit:cover; }
  .bar { height:14px; background:#111; border-radius:7px; overflow:hidden; margin:4px 0 10px; }
  .fill { height:100%; }
  #hpFill { background:#d64545; }
  #xpFill { background:#4a90e2; }
  .classes { display:flex; gap:8px; }
  .classes button { flex:1; padding:10px 4px; border:2px solid #444;
         background:#1b1b24; color:#eee; border-radius:8px; font-size:14px; }
  .classes button.active { border-color:#f5c542; color:#f5c542; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .grid5 { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .slot { aspect-ratio:1; background:#1b1b24; border:1px dashed #555;
         border-radius:8px; display:flex; align-items:center;
         justify-content:center; font-size:10px; color:#888;
         text-align:center; padding:2px; word-break:break-word; }
  .slot.full { border:2px solid #888; color:#eee; }
  .slot.on { border-color:#f5c542; }
  .hint { color:#888; font-size:12px; margin-top:6px; }
  #status { color:#aaa; font-size:13px; }
</style>
</head>
<body>
  <div class="card head">
    <img id="avatar" alt="">
    <div>
      <div id="name" style="font-size:18px;font-weight:bold">...</div>
      <div id="silver">Серебро: 0</div>
    </div>
  </div>

  <div class="card">
    <div id="levelText">Уровень 1</div>
    <div>HP: <span id="hpText"></span></div>
    <div class="bar"><div class="fill" id="hpFill"></div></div>
    <div>Опыт: <span id="xpText"></span></div>
    <div class="bar"><div class="fill" id="xpFill"></div></div>
    <div>Очки прокачки: <span id="points">0</span></div>
  </div>

  <div class="card">
    <div style="margin-bottom:8px">Класс</div>
    <div class="classes">
      <button data-c="fighter">Боец</button>
      <button data-c="rogue">Плут</button>
      <button data-c="gatherer">Сборщик</button>
    </div>
  </div>

  <div class="card">
    <div style="margin-bottom:8px">Экипировка</div>
    <div class="grid4" id="equip"></div>
    <div class="hint">Нажми на надетый предмет, чтобы снять</div>
  </div>

  <div class="card">
    <div style="margin-bottom:8px">Инвентарь <span id="invCount"></span></div>
    <div class="grid5" id="inv"></div>
    <div class="hint">Нажми на предмет, чтобы надеть или снять</div>
  </div>

  <div id="status">Загрузка...</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const status = document.getElementById("status");
const SLOTS = [
  ["helmet","Шлем"], ["chest","Нагрудник"], ["gloves","Перчатки"],
  ["pants","Штаны"], ["boots","Ботинки"], ["amulet","Амулет"],
  ["weapon","Оружие"]
];
const INV_SIZE = 10;

function show(p) {
  document.getElementById("name").textContent = p.first_name || p.username || "Игрок";
  document.getElementById("silver").textContent = "Серебро: " + p.balance;
  document.getElementById("levelText").textContent = "Уровень " + p.level;
  document.getElementById("hpText").textContent = p.hp + " / 100";
  document.getElementById("hpFill").style.width = Math.min(100, p.hp) + "%";
  document.getElementById("xpText").textContent = p.xp + " / " + p.xp_to_next;
  document.getElementById("xpFill").style.width =
      Math.min(100, p.xp / p.xp_to_next * 100) + "%";
  document.getElementById("points").textContent = p.stat_points;
  if (p.photo_url) document.getElementById("avatar").src = p.photo_url;
  document.querySelectorAll(".classes button").forEach(b =>
    b.classList.toggle("active", b.dataset.c === p.class));
}

function showInventory(list) {
  const equip = document.getElementById("equip");
  equip.innerHTML = "";
  SLOTS.forEach(([key, label]) => {
    const row = list.find(r => r.equipped && r.items && r.items.slot === key);
    const d = document.createElement("div");
    d.className = "slot" + (row ? " full on" : "");
    d.textContent = row ? row.items.name : label;
    if (row) d.onclick = () => act("/inventory/unequip", row.id);
    equip.appendChild(d);
  });

  const inv = document.getElementById("inv");
  inv.innerHTML = "";
  document.getElementById("invCount").textContent =
    "(" + list.length + "/" + INV_SIZE + ")";
  for (let i = 0; i < INV_SIZE; i++) {
    const row = list[i];
    const d = document.createElement("div");
    if (row) {
      d.className = "slot full" + (row.equipped ? " on" : "");
      d.textContent = (row.equipped ? "✓ " : "") + row.items.name;
      d.onclick = () => {
        if (!row.items.slot) {
          status.textContent = "Этот предмет нельзя надеть";
          return;
        }
        act(row.equipped ? "/inventory/unequip" : "/inventory/equip", row.id);
      };
    } else {
      d.className = "slot";
    }
    inv.appendChild(d);
  }
}

async function call(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error("Ошибка " + r.status);
  return r.json();
}

async function act(url, invId) {
  try {
    const res = await call(url, {init_data: tg.initData, inv_id: invId});
    showInventory(res.inventory);
    status.textContent = "";
  } catch (e) {
    status.textContent = "Ошибка: " + e.message;
  }
}

async function start() {
  try {
    const res = await call("/auth/telegram", {init_data: tg.initData});
    show(res.player);
    showInventory(res.inventory);
    status.textContent = "";
  } catch (e) {
    status.textContent = "Не удалось войти: " + e.message;
  }
}

document.querySelectorAll(".classes button").forEach(b => {
  b.onclick = async () => {
    try {
      const res = await call("/profile/class",
        {init_data: tg.initData, player_class: b.dataset.c});
      show(res.player);
    } catch (e) {
      status.textContent = "Ошибка: " + e.message;
    }
  };
});

start();
</script>
</body>
</html>
